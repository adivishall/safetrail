# Build, test, and publish the safetrail dashboard to GitHub Pages.
#
# This project has no server -- the engine is a C++ program that emits ONE
# self-contained HTML file. So "deploy" means: compile the engine, prove it
# works, generate the dashboard from real data, and host that static file.
name: build-test-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: g++ --version

      - name: Run the test suite
        run: make test CXX=g++          # 10,924 checks, gates the deploy

      - name: Run the benchmarks
        run: make bench CXX=g++ || true # informational; never blocks deploy

      - name: Generate the dashboard from real OSM data
        run: |
          make dashboard CXX=g++
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp slides.html _site/slides.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results/*.csv
          if-no-files-found: ignore

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Advisory: runs in parallel, does NOT gate the deploy. Sanitizer builds are
  # slow, and a memory/UB regression should surface without blocking a doc change.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests under AddressSanitizer + UBSan
        run: make asan CXX=g++

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
