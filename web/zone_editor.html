<!doctype html>
<!--
  safetrail zone editor -- draw hazard zones, get live self-intersection and
  overlap warnings, export GeoJSON that ZoneStore::load_geojson reads directly.

  Operators authoring zones are police and tourism staff, not GIS analysts (see
  GAP 10 in docs/GAP_ANALYSIS.md) -- they WILL draw a self-intersecting bowtie by
  accident, and the engine correctly rejects it on load. Catching that live, while
  drawing, beats a rejected-file round trip. The point-in-polygon and
  segment-intersection checks below are a direct port of the same orient/on_seg
  logic in src/geo/polygon.cpp and geo/containment.cpp -- same rule, same
  tolerance, so a shape flagged clean here loads clean in the real engine. This is
  the same "mirror the C++ geometry in the tool" discipline tools/osm_to_zones.py
  already follows for the OSM import path; this is the manual-authoring path.

  Zero dependencies, zero network requests -- same rule as dashboard.html.
-->
<meta charset="utf-8">
<title>safetrail :: zone editor</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--line:#2a323d;--fg:#e6edf3;--dim:#8b949e;
        --r:#f85149;--o:#d29922;--g:#3fb950;--b:#58a6ff;--u:#bc8cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;
         gap:16px;align-items:baseline;flex-wrap:wrap}
  h1{font-size:15px;margin:0;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:11px}
  #wrap{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 46px)}
  @media(max-width:900px){#wrap{grid-template-columns:1fr;height:auto}}
  #stage{position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  aside{border-left:1px solid var(--line);overflow-y:auto;padding:12px}
  @media(max-width:900px){aside{border-left:0;border-top:1px solid var(--line)}}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
     margin:14px 0 6px;font-weight:600}
  h2:first-child{margin-top:0}
  button,input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);
         border-radius:5px;padding:5px 8px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--b)}
  input,select{cursor:default;width:100%;margin-bottom:6px}
  label{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
  .row{display:flex;gap:6px}
  .row button{flex:1}
  #banner{padding:8px 10px;border-radius:5px;margin-bottom:10px;font-size:12px;font-weight:600}
  .banner-ok{background:#3fb95022;color:var(--g);border:1px solid #3fb95055}
  .banner-warn{background:#f8514922;color:var(--r);border:1px solid #f8514955}
  .banner-idle{background:var(--panel);color:var(--dim);border:1px solid var(--line)}
  .zone{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;
        margin-bottom:4px;border-radius:4px;background:var(--panel);font-size:11px;
        border-left:3px solid var(--b);cursor:pointer}
  .zone:hover{border-color:var(--b)}
  .zone .name{font-weight:600}
  .zone .del{color:var(--r);cursor:pointer}
  .kv{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:2px 0}
  textarea{width:100%;height:120px;background:var(--panel);color:var(--fg);
           border:1px solid var(--line);border-radius:5px;font:11px/1.4 ui-monospace,monospace;
           padding:6px}
</style>
<header>
  <h1>zone editor</h1>
  <span class="sub">click the map to place vertices &middot; live self-intersection + overlap check &middot; exports GeoJSON ZoneStore loads directly</span>
</header>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas></div>
  <aside>
    <h2>draft zone</h2>
    <div id="banner" class="banner-idle">click the map to start a zone</div>
    <label>name</label><input id="f_name" value="New Zone">
    <label>kind</label>
    <select id="f_kind">
      <option value="restricted">restricted</option>
      <option value="caution" selected>caution</option>
      <option value="safe">safe</option>
      <option value="advisory">advisory</option>
    </select>
    <label>severity (1-5)</label><input id="f_sev" type="number" min="1" max="5" value="3">
    <label>max dwell, seconds (0 = no limit)</label><input id="f_dwell" type="number" min="0" value="0">
    <label>active from / to, seconds (blank = always)</label>
    <div class="row"><input id="f_from" type="number" placeholder="from"><input id="f_to" type="number" placeholder="to"></div>
    <div class="row">
      <button id="undo">undo point</button>
      <button id="clear">clear draft</button>
    </div>
    <button id="finish" style="width:100%;margin-top:6px">finish zone</button>

    <h2>zones (<span id="zcount">0</span>)</h2>
    <div id="zlist"><div class="kv">none yet</div></div>

    <h2>load / export</h2>
    <input id="loadfile" type="file" accept=".geojson,.json">
    <div class="row">
      <button id="export">export geojson</button>
      <button id="showtext">show text</button>
    </div>
    <textarea id="out" style="display:none" readonly></textarea>
  </aside>
</div>
<script>
'use strict';
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const banner = document.getElementById('banner');

// ── geometry: a direct port of src/geo/polygon.cpp's orient/on_seg/segs_cross,
// same tolerance (1e-14), so a shape flagged OK here loads OK in the real engine.
function orient(a, b, c) {
  const v = (b[1]-a[1])*(c[0]-a[0]) - (b[0]-a[0])*(c[1]-a[1]);
  return v > 1e-14 ? 1 : (v < -1e-14 ? -1 : 0);
}
function onSeg(a, b, p) {
  return Math.min(a[1],b[1])-1e-14 <= p[1] && p[1] <= Math.max(a[1],b[1])+1e-14 &&
         Math.min(a[0],b[0])-1e-14 <= p[0] && p[0] <= Math.max(a[0],b[0])+1e-14;
}
function segsCross(a, b, c, d) {
  const o1=orient(a,b,c), o2=orient(a,b,d), o3=orient(c,d,a), o4=orient(c,d,b);
  if (o1!==o2 && o3!==o4) return true;
  if (o1===0 && onSeg(a,b,c)) return true;
  if (o2===0 && onSeg(a,b,d)) return true;
  if (o3===0 && onSeg(c,d,a)) return true;
  if (o4===0 && onSeg(c,d,b)) return true;
  return false;
}
// Ray casting, mirroring geo/containment.cpp's contains(). Points are [lat,lon].
function contains(ring, p) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const a = ring[i], b = ring[j];
    if (((a[0] > p[0]) !== (b[0] > p[0])) &&
        (p[1] < (b[1]-a[1]) * (p[0]-a[0]) / (b[0]-a[0]) + a[1])) inside = !inside;
  }
  return inside;
}
// A ring self-intersects if any two NON-adjacent edges cross (same rule as
// Polygon::validate(): consecutive edges, and the wrap-around pair, are exempt).
function selfIntersects(ring) {
  const n = ring.length;
  for (let i = 0; i < n; i++) {
    const a = ring[i], b = ring[(i+1)%n];
    for (let j = i+1; j < n; j++) {
      const adjacent = (j === i+1) || (i === 0 && j === n-1);
      if (adjacent) continue;
      const c = ring[j], d = ring[(j+1)%n];
      if (segsCross(a, b, c, d)) return true;
    }
  }
  return false;
}
// Overlap heuristic: any vertex of one ring inside the other, or any edge pair
// crossing. Sufficient to catch the cases that matter for a warning (not a
// formal boolean-overlap engine, which is out of scope for a live editor hint).
function ringsOverlap(a, b) {
  for (const p of a) if (contains(b, p)) return true;
  for (const p of b) if (contains(a, p)) return true;
  for (let i = 0; i < a.length; i++) {
    const p1 = a[i], p2 = a[(i+1)%a.length];
    for (let j = 0; j < b.length; j++) {
      const p3 = b[j], p4 = b[(j+1)%b.length];
      if (segsCross(p1, p2, p3, p4)) return true;
    }
  }
  return false;
}

// ── state ──────────────────────────────────────────────────────────────────
let zones = [];         // {name,kind,sev,dwell,from,to,ring:[[lat,lon],...]}
let draft = [];         // [[lat,lon],...] being drawn now

// View bounds -- fit to whatever is loaded, default to the Shillong demo area.
let B = {n:25.72, s:25.50, e:91.98, w:91.78};
// Fits the view to SAVED zones only, never to the in-progress draft. This must
// stay fixed while a zone is being drawn: toLatLon() below is the inverse of
// this mapping, and if B changed after every vertex, each click would be
// converted through a DIFFERENT screen<->coordinate transform than the ones
// before it -- silently distorting the shape's topology (a bowtie can stop
// looking like one) even though every point looks right on screen as it's
// placed. Refit only happens on load/finish/delete, i.e. when `zones` changes.
function fitBounds() {
  if (!zones.length) return;
  let n=-1e9,s=1e9,e=-1e9,w=1e9;
  for (const z of zones) for (const p of z.ring) { n=Math.max(n,p[0]);s=Math.min(s,p[0]);e=Math.max(e,p[1]);w=Math.min(w,p[1]); }
  if (n < s) return;
  const pad = Math.max(0.01, (n-s)*0.15);
  B = {n:n+pad, s:s-pad, e:e+pad, w:w-pad};
}

let W=0,H=0,sc=1,ox=0,oy=0;
function resize() {
  const r = cv.parentElement.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  W = r.width; H = Math.max(r.height, 320);
  cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const sx = W/(B.e-B.w), sy = H/(B.n-B.s);
  sc = Math.min(sx,sy)*0.92;
  ox = (W-(B.e-B.w)*sc)/2; oy = (H-(B.n-B.s)*sc)/2;
}
const X = lon => ox + (lon-B.w)*sc, Y = lat => H-oy-(lat-B.s)*sc;
const toLatLon = (px,py) => [ (H-oy-py)/sc + B.s, (px-ox)/sc + B.w ];

const ZC = {restricted:'#f85149', caution:'#d29922', safe:'#3fb950', advisory:'#8b949e'};

function draftStatus() {
  if (draft.length < 3) return {ok:true, msg: draft.length===0 ? 'click the map to start a zone' : 'need at least 3 points'};
  if (selfIntersects(draft)) return {ok:false, msg:'self-intersecting -- the engine will reject this shape (GAP 10)'};
  for (const z of zones) if (ringsOverlap(draft, z.ring)) return {ok:false, msg:'overlaps existing zone "'+z.name+'"'};
  return {ok:true, msg:'valid -- ' + draft.length + ' vertices, no conflicts'};
}

function draw() {
  cx.fillStyle = '#0e1116'; cx.fillRect(0,0,W,H);
  // grid
  cx.strokeStyle = 'rgba(139,148,158,.08)'; cx.lineWidth = 1;
  for (let i=0;i<=10;i++){const x=ox+(W-2*ox)*i/10;cx.beginPath();cx.moveTo(x,oy);cx.lineTo(x,H-oy);cx.stroke();}

  for (const z of zones) {
    cx.beginPath();
    z.ring.forEach((p,i)=> i? cx.lineTo(X(p[1]),Y(p[0])) : cx.moveTo(X(p[1]),Y(p[0])));
    cx.closePath();
    cx.fillStyle = (ZC[z.kind]||'#8b949e') + '26'; cx.fill();
    cx.strokeStyle = ZC[z.kind]||'#8b949e'; cx.lineWidth = 1.4; cx.stroke();
  }

  if (draft.length) {
    const st = draftStatus();
    cx.strokeStyle = st.ok ? '#58a6ff' : '#f85149'; cx.lineWidth = 2;
    cx.beginPath();
    draft.forEach((p,i)=> i? cx.lineTo(X(p[1]),Y(p[0])) : cx.moveTo(X(p[1]),Y(p[0])));
    if (draft.length >= 3) cx.closePath();
    cx.stroke();
    if (draft.length >= 3) { cx.fillStyle = (st.ok?'#58a6ff':'#f85149') + '1f'; cx.fill(); }
    for (const p of draft) { cx.beginPath(); cx.arc(X(p[1]),Y(p[0]),4,0,6.284); cx.fillStyle='#e6edf3'; cx.fill(); }
  }
}

function renderPanel() {
  const st = draftStatus();
  banner.textContent = st.msg;
  banner.className = draft.length===0 ? 'banner-idle' : (st.ok ? 'banner-ok' : 'banner-warn');
  document.getElementById('zcount').textContent = zones.length;
  const list = document.getElementById('zlist');
  list.innerHTML = zones.length ? zones.map((z,i) => `
    <div class="zone" style="border-left-color:${ZC[z.kind]||'#8b949e'}" data-i="${i}">
      <span><span class="name">${z.name}</span> &middot; ${z.kind} sev${z.sev} &middot; ${z.ring.length}v</span>
      <span class="del" data-del="${i}">delete</span>
    </div>`).join('') : '<div class="kv">none yet</div>';
}
// redraw(): repaint under the CURRENT view -- used while drawing, never moves B.
// render(): refit the view to `zones`, then redraw -- used only when the saved
// zone set changes (finish/delete/load), so the map doesn't jump mid-click.
function redraw() { resize(); draw(); renderPanel(); }
function render() { fitBounds(); redraw(); }

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  draft.push(toLatLon(e.clientX - r.left, e.clientY - r.top));
  redraw();
});
document.getElementById('undo').onclick = () => { draft.pop(); redraw(); };
document.getElementById('clear').onclick = () => { draft = []; redraw(); };
document.getElementById('finish').onclick = () => {
  const st = draftStatus();
  if (draft.length < 3) { alert('need at least 3 vertices'); return; }
  if (!st.ok) { if (!confirm(st.msg + '\n\nSave anyway? (the engine will reject this on load)')) return; }
  const from = document.getElementById('f_from').value, to = document.getElementById('f_to').value;
  zones.push({
    name: document.getElementById('f_name').value || ('Zone ' + (zones.length+1)),
    kind: document.getElementById('f_kind').value,
    sev: Math.max(1, Math.min(5, +document.getElementById('f_sev').value || 1)),
    dwell: +document.getElementById('f_dwell').value || 0,
    from: from === '' ? null : +from,
    to: to === '' ? null : +to,
    ring: draft,
  });
  draft = [];
  document.getElementById('f_name').value = 'New Zone';
  render();
};
document.getElementById('zlist').addEventListener('click', e => {
  const del = e.target.getAttribute('data-del');
  if (del !== null) { zones.splice(+del, 1); render(); return; }
});

function toGeoJSON() {
  const feats = zones.map(z => {
    const props = { name: z.name, kind: z.kind, severity: z.sev };
    if (z.dwell) props.max_dwell_s = z.dwell;
    if (z.from !== null) props.active_from_s = z.from;
    if (z.to !== null) props.active_to_s = z.to;
    const coords = [z.ring.map(p => [p[1], p[0]])];   // -> [lon,lat], GeoJSON order
    coords[0].push(coords[0][0]);                      // close the ring
    return {type:'Feature', properties: props, geometry: {type:'Polygon', coordinates: coords}};
  });
  return JSON.stringify({type:'FeatureCollection', features: feats}, null, 1);
}

document.getElementById('export').onclick = () => {
  const blob = new Blob([toGeoJSON()], {type:'application/geo+json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'zones.geojson'; a.click();
};
document.getElementById('showtext').onclick = () => {
  const ta = document.getElementById('out');
  ta.style.display = ta.style.display === 'none' ? 'block' : 'none';
  ta.value = toGeoJSON();
};

document.getElementById('loadfile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const gj = JSON.parse(reader.result);
      let loaded = 0, rejected = 0;
      for (const f of (gj.features || [])) {
        const props = f.properties || {};
        const coords = f.geometry && f.geometry.coordinates && f.geometry.coordinates[0];
        if (!coords || coords.length < 3) continue;
        let ring = coords.map(c => [c[1], c[0]]);       // -> [lat,lon]
        // strip a repeated closing vertex, matching strip_closing_vertex()
        if (ring.length > 1) {
          const a = ring[0], b = ring[ring.length-1];
          if (Math.abs(a[0]-b[0]) < 1e-12 && Math.abs(a[1]-b[1]) < 1e-12) ring.pop();
        }
        if (ring.length < 3) continue;
        if (selfIntersects(ring)) { rejected++; continue; }   // same gate the engine applies
        zones.push({
          name: props.name || ('Zone ' + (zones.length+1)),
          kind: props.kind || 'caution',
          sev: props.severity || 1,
          dwell: props.max_dwell_s || 0,
          from: props.active_from_s ?? null,
          to: props.active_to_s ?? null,
          ring,
        });
        loaded++;
      }
      render();
      if (rejected) alert(`loaded ${loaded} zones, rejected ${rejected} self-intersecting shape(s)`);
    } catch (err) { alert('could not parse GeoJSON: ' + err.message); }
  };
  reader.readAsText(file);
});

addEventListener('resize', render);
render();
</script>
