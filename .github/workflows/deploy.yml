# Build, test, and publish the safetrail dashboard to GitHub Pages.
#
# This project has no server -- the engine is a C++ program that emits ONE
# self-contained HTML file. So "deploy" means: compile the engine, prove it
# works, generate the dashboard from real data, and host that static file.
#
# ── What gates what, and why ─────────────────────────────────────────────────
#
#   tests        GATE. A correctness regression must not reach the page.
#   sanitizers   GATE. Memory errors and UB are correctness failures; running
#                them "advisory" meant a real regression could ship green, which
#                is the same as not running them. The whole suite runs under
#                ASan+UBSan with -fno-sanitize-recover, so UB aborts rather than
#                being reported and ignored.
#   determinism  GATE. The README calls determinism non-negotiable; this runs the
#                same seed twice and diffs the output byte for byte.
#   cmake        GATE. Cheap, and it is the check that catches the two build
#                systems drifting apart.
#   benchmarks   INFORMATIONAL. Timings on shared CI runners are noisy, so gating
#                on them would produce flaky failures that teach people to ignore
#                red builds. They still run, and their CSVs are uploaded.
#
# `|| true` appears exactly once below, on the benchmark step, and that is
# deliberate rather than incidental -- it used to be on steps whose failure meant
# something.
name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Correctness gates ───────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compiler version
        run: g++ --version
      - name: Header hygiene (every header compiles standalone)
        run: make check CXX=g++
      - name: Unit, golden and integration tests
        run: make -j$(nproc) test CXX=g++
      - name: Deterministic replay (same seed twice, byte-identical)
        run: make determinism CXX=g++

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Whole suite under AddressSanitizer + UndefinedBehaviorSanitizer
        run: make -j$(nproc) asan CXX=g++
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1

  # The other build system, on the same tree. Catches Make/CMake drift and any
  # warning that only one of the two sets of flags surfaces.
  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release -S .
      - name: Build
        run: cmake --build build-cmake -j$(nproc)
      - name: ctest
        run: ctest --test-dir build-cmake --output-on-failure

  # macOS as well as Linux: the project claims to build easily on both, and
  # libc++ vs libstdc++ is where portability assumptions surface.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test with clang++
        run: make -j$(sysctl -n hw.ncpu) test CXX=clang++

  # ── Artifact generation ─────────────────────────────────────────────────────
  build:
    needs: [test, sanitize, cmake]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run the benchmarks
        run: make bench CXX=g++ || true   # informational; timings on shared CI runners are noisy

      - name: Generate the dashboard from real OSM data
        run: |
          make dashboard CXX=g++
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp slides.html _site/slides.html

      - name: Upload benchmark CSVs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results/*.csv
          if-no-files-found: ignore

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
