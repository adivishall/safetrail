# Build, test, and publish the safetrail dashboard to GitHub Pages.
#
# This project has no server -- the engine is a C++ program that emits ONE
# self-contained HTML file. So "deploy" means: compile the engine, prove it
# works, generate the dashboard from real data, and host that static file.
#
# ── What gates what, and why ─────────────────────────────────────────────────
#
#   warnings     GATE. Every build job compiles with WERROR=1 against the shared
#                flag list in tools/build/*.flags; clang (Linux and macOS) also
#                enforces the -Wconversion family.
#   tests        GATE. A correctness regression must not reach the page.
#   stress       GATE. The randomised differential / property tests at 10x size.
#   mutation     GATE. tools/mutation_check.py injects known bugs into the core;
#                every one must make a test fail, or the tests are not testing.
#   analysis     GATE. Clang Static Analyzer over the library and apps.
#   sanitizers   GATE. Memory errors and UB are correctness failures; running
#                them "advisory" meant a real regression could ship green, which
#                is the same as not running them. The whole suite runs under
#                ASan+UBSan with -fno-sanitize-recover, so UB aborts rather than
#                being reported and ignored.
#   determinism  GATE. The README calls determinism non-negotiable; this runs the
#                same seed twice and diffs the output byte for byte.
#   cmake        GATE. Cheap, and it is the check that catches the two build
#                systems drifting apart -- both that they compile, and that they
#                are looking at the same files.
#   macos        GATE. The README says the project builds with nothing but a
#                compiler on macOS and Linux. A claim that is only checked on one
#                of them is a claim about one of them, so libc++ gates too.
#   benchmarks   INFORMATIONAL. Timings on shared CI runners are noisy, so gating
#                on them would produce flaky failures that teach people to ignore
#                red builds. They run in their own job (`bench`), whose CSVs are
#                uploaded as an artifact and never reach the published site.
#
# Exactly one step below may fail without failing the run: the benchmark step,
# via `continue-on-error`. When it fails, the run says so (a warning annotation)
# and uploads no benchmark artifact, so a failed measurement never looks like a
# successful one. No step uses `|| true`; it used to hide failures that meant
# something.
# Runner images are pinned (ubuntu-24.04 ships g++ 13; macos-15 ships Apple
# clang) so that a compiler upgrade -- and whatever new -Werror diagnostics it
# brings -- is a deliberate change to this file, not something that happens to a
# commit because GitHub moved "latest".
name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency: one group per pull request, and one per branch for push and
# manual runs.
#   pull_request     group pages-<PR number>, cancel-in-progress: a newer push to
#                    the same PR cancels its superseded run. Other PRs and main
#                    are in other groups, so a PR run can never cancel them.
#   push, dispatch   group pages-refs/heads/<branch>, no cancel-in-progress: a
#                    running main run, and so its deploy, always finishes. A newer
#                    main run waits for the whole running run, benchmark included.
#                    GitHub keeps at most one pending run per group and cancels it
#                    in favour of any newer one, so only the newest queued main
#                    run deploys next; this is not a queue of every commit.
# The single shared `pages` group this replaces let a pull-request run cancel a
# running main run (36990828476, 2 Oct 2026).
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Correctness gates ───────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compiler version
        run: g++ --version
      - name: Documentation references resolve
        run: python3 tools/check_docs.py
      - name: Results tables match the committed benchmark CSVs
        run: python3 tools/render_results.py --check
      - name: Header hygiene (every header compiles standalone)
        run: make check CXX=g++ WERROR=1
      - name: Unit, property, differential and golden tests
        run: make -j$(nproc) test CXX=g++ WERROR=1
      - name: Deterministic replay (same seed twice, byte-identical)
        run: make determinism CXX=g++ WERROR=1

  # The same suite built by clang on Linux: clang enforces the -Wconversion
  # family (see the Makefile), and a second compiler is a second opinion on UB
  # and portability. Then the randomised tests at 10x, and static analysis.
  clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compiler version
        run: clang++ --version
      - name: Tests under clang with -Werror
        run: make -j$(nproc) test CXX=clang++ WERROR=1
      - name: Stress (randomised tests at 10x)
        run: make -j$(nproc) stress CXX=clang++ WERROR=1
      - name: Clang Static Analyzer
        run: make analyze CXX=clang++

  # Do the tests catch broken code? Each mutant in tools/mutation_check.py is a
  # realistic bug in the core; the job fails if any survives.
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Mutation check
        run: CXX=g++ python3 tools/mutation_check.py

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Whole suite under AddressSanitizer + UndefinedBehaviorSanitizer
        run: make -j$(nproc) asan CXX=g++
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1

  # The other build system, on the same tree. Catches Make/CMake drift and any
  # warning that only one of the two sets of flags surfaces.
  cmake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release -DSAFETRAIL_WERROR=ON -S .
      - name: Build
        run: cmake --build build-cmake -j$(nproc)
      - name: ctest
        run: ctest --test-dir build-cmake --output-on-failure

      # The README's determinism claim is "same seed, byte-identical output".
      # Two runs of one binary (the test job) show the program is deterministic;
      # this shows the CMake -O3 build and the make -O2 build agree with each
      # other, which is what -ffp-contract=off is there to guarantee.
      - name: Make and CMake builds agree byte for byte
        run: |
          make -j$(nproc) build/safetrail_headless CXX=g++ WERROR=1
          args="--zones data/zones/shillong_osm.geojson --tourists 30 --hours 1 --seed 4242 --show 40"
          ./build/safetrail_headless $args > /tmp/det_make.txt
          ./build-cmake/safetrail_headless $args > /tmp/det_cmake.txt
          cmp /tmp/det_make.txt /tmp/det_cmake.txt && echo "identical"

      # Both build systems discover sources by globbing the same patterns, so
      # drift should be impossible by construction. "Should be" is the phrase that
      # precedes every drift, and this repo has drifted before -- the Makefile
      # once carried a hand-written list that fell behind the tree. Two lines to
      # turn a structural argument into a checked fact.
      - name: Make and CMake see the same source set
        run: |
          make manifest CXX=g++ | sed -n 's|^  src/|src/|p' | sort > /tmp/make_src.txt
          cmake -B build-cmake -S . 2>/dev/null | grep -q 'source files'
          find src -name '*.cpp' | sort > /tmp/tree_src.txt
          diff -u /tmp/tree_src.txt /tmp/make_src.txt
          echo "make sees $(wc -l < /tmp/make_src.txt) sources, matching the tree"
          make manifest CXX=g++ | sed -n 's|^  tests/|tests/|p' | sort > /tmp/make_tests.txt
          find tests -name '*_test.cpp' | sort > /tmp/tree_tests.txt
          diff -u /tmp/tree_tests.txt /tmp/make_tests.txt
          echo "make sees $(wc -l < /tmp/make_tests.txt) test files, matching the tree"

  # macOS as well as Linux: the project claims to build easily on both, and
  # libc++ vs libstdc++ is where portability assumptions surface.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build and test with clang++
        run: make -j$(sysctl -n hw.ncpu) test CXX=clang++ WERROR=1
      - name: Whole suite under UBSan (ASan cannot run on this platform; see Makefile)
        run: make -j$(sysctl -n hw.ncpu) ubsan CXX=clang++

  # ── Informational benchmark ─────────────────────────────────────────────────
  # Its own job and workspace, because `make bench` rewrites committed evidence:
  # bench/results/*.csv and environment.txt, the chart bench/plots/index_scaling.svg,
  # and the generated tables in README.md, docs/RESULTS.md and
  # docs/REVIEW_SLIDES.html. Run where the site was assembled, it published this
  # runner's timings under "one laptop" captions. Here it can only make an artifact.
  # The step timeout matters beyond this job: the next main run waits for this
  # run to finish (see Concurrency above), so a hung benchmark must not hold it.
  bench:
    needs: [test, clang, mutation, sanitize, cmake, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Run the benchmarks (shared-runner timings, informational)
        id: bench
        continue-on-error: true
        timeout-minutes: 15
        run: make bench CXX=g++

      - name: Report a failed benchmark
        if: steps.bench.outcome != 'success'
        run: |
          echo "::warning title=make bench failed::make bench exited non-zero or timed out. Either the build or run failed, or one of the benchmark's own result-checksum checks reported MISMATCH (see the step log). No benchmark-results artifact is uploaded for this run."

      - name: Upload benchmark CSVs
        if: steps.bench.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench/results/*.csv
            bench/results/environment.txt
          if-no-files-found: error

  # ── The site, from committed evidence only ─────────────────────────────────
  # A clean checkout of this run's commit. Nothing here runs a benchmark or
  # re-renders a table: the dashboard reads bench/results/index_scaling.csv as
  # committed, and slides.html is docs/REVIEW_SLIDES.html as committed (chart path
  # made site-relative). It does not wait for `bench`.
  build:
    needs: [test, clang, mutation, sanitize, cmake, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Generate the dashboard from real OSM data
        run: |
          make dashboard CXX=g++
          mkdir -p _site
          cp dashboard.html _site/index.html
          # the review deck, with its repo-relative chart path made site-relative
          sed 's|\.\./bench/plots/|bench/plots/|g' docs/REVIEW_SLIDES.html > _site/slides.html
          mkdir -p _site/images _site/bench/plots
          cp docs/images/*.png _site/images/
          cp bench/plots/index_scaling.svg _site/bench/plots/

      - name: The site uses committed evidence only
        run: |
          # make dashboard writes only ignored files (dashboard.html, build/), so
          # any tracked file that differs from this commit means a step rewrote
          # evidence before publishing.
          git diff --exit-code --stat HEAD
          sed 's|\.\./bench/plots/|bench/plots/|g' docs/REVIEW_SLIDES.html | cmp - _site/slides.html
          cmp bench/plots/index_scaling.svg _site/bench/plots/index_scaling.svg
          # The dashboard copies the committed scaling CSV into its benchmark
          # table field for field; an empty or different table means it did not
          # read the committed file.
          rows=$(awk -F, 'NR > 1 && NF >= 7 { printf "%s{\"zones\":%s,\"brute\":%s,\"quad\":%s,\"rtree\":%s,\"qgain\":%s,\"rgain\":%s,\"cand\":%s}", sep, $1, $2, $3, $4, $5, $6, $7; sep = "," }' bench/results/index_scaling.csv)
          test -n "$rows"
          grep -qF "\"experiment\":[$rows]" _site/index.html
          echo "site built from $(git rev-parse --short HEAD) as committed"

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
